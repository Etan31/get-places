# fly.toml app configuration file generated for get-places on 2026-07-14T22:55:20+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'get-places'
primary_region = 'sin'

[build]

[env]
  API_PORT = '3001'
  CLIENT_ORIGIN = 'https://get-places.vercel.app'
  SCRAPER_HEADLESS = 'true'
  SCRAPER_CONCURRENCY = '5'
  SCRAPER_MAX_RESULTS = '50'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
